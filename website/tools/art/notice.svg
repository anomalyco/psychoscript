<?xml version="1.0" encoding="UTF-8"?>
<!-- The notice NormalScript puts up over the picture, twice: as it is on a wide
     screen (640 by 168, at the top) and on a narrow one (560 by 296, from y = 180).
     liquid.js cuts the card's shape, its edge and its shadow itself; this is only
     what is printed on it. Rasterise at twice the size:
     resvg -w 1280 tools/art/notice.svg site/art/notice.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="1280" height="960" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="640" height="480" fill="#f7f7f7"/>

  <!-- Wide. -->
  <g>
    <rect x="24" y="24" width="14" height="14" rx="2" fill="#b9b9b9"/>
    <text x="45" y="35.4" font-size="12.5" font-weight="700" fill="#8b8b8b" letter-spacing="-0.1">NormalScript<tspan font-size="7.5" dy="-4">®</tspan></text>
    <text x="24" y="75" font-size="23" font-weight="700" fill="#555555" letter-spacing="-0.6">We value your compliance.</text>
    <g font-size="13" fill="#838383">
      <text x="24" y="101">NormalScript® uses strictly necessary greyness to keep</text>
      <text x="24" y="120">your experience within expected parameters. Colour has</text>
      <text x="24" y="139">been disabled for your convenience.</text>
    </g>
    <rect x="444" y="43" width="172" height="36" rx="4" fill="#5e5e5e"/>
    <text x="530" y="65.6" font-size="13" font-weight="500" fill="#f7f7f7" text-anchor="middle">Accept all normalcy</text>
    <rect x="444.5" y="89.5" width="171" height="35" rx="3.5" fill="none" stroke="#c6c6c6"/>
    <text x="530" y="111.6" font-size="13" font-weight="500" fill="#7c7c7c" text-anchor="middle">Manage preferences</text>
  </g>

  <!-- Narrow. -->
  <g transform="translate(0 180)">
    <rect x="28" y="28" width="20" height="20" rx="3" fill="#b9b9b9"/>
    <text x="58" y="44.4" font-size="18" font-weight="700" fill="#8b8b8b" letter-spacing="-0.15">NormalScript<tspan font-size="10.5" dy="-6">®</tspan></text>
    <text x="28" y="98" font-size="33" font-weight="700" fill="#555555" letter-spacing="-0.9">We value your compliance.</text>
    <g font-size="19" fill="#838383">
      <text x="28" y="134">NormalScript® uses strictly necessary greyness to keep</text>
      <text x="28" y="161">your experience within expected parameters. Colour</text>
      <text x="28" y="188">has been disabled for your convenience.</text>
    </g>
    <rect x="28" y="212" width="246" height="56" rx="5" fill="#5e5e5e"/>
    <text x="151" y="246.6" font-size="19" font-weight="500" fill="#f7f7f7" text-anchor="middle">Accept all normalcy</text>
    <rect x="286.5" y="212.5" width="245" height="55" rx="4.5" fill="none" stroke="#c6c6c6"/>
    <text x="409" y="246.6" font-size="19" font-weight="500" fill="#7c7c7c" text-anchor="middle">Manage preferences</text>
  </g>
</svg>
