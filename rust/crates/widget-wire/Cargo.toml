[package]
name = "widget-wire"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "OpenCode widgets' binary wire format: the host's encoder from PsychoScript values, and a bounds-checked decoder"

[dependencies]
psychoscript = { path = "../psychoscript" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
