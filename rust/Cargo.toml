[workspace]
resolver = "3"
members = ["crates/psychoscript", "crates/psychoscript-mobile", "crates/widget-wire", "crates/widget-gpu", "bench", "test262"]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1

# wgpu-hal as Rune vendors it (`vendor/wgpu-hal`: 30.0.1 plus `vendor/wgpu-hal.patch`): on Metal a GPU that stops a
# queue's work loses the device (rune #1561; stock wgpu-hal counts the work finished and tells nothing), until wgpu
# ships it (gfx-rs/wgpu#10875). Its other changes are DX12's and GL's, built for neither iOS nor Android; Vulkan's code
# is 30.0.2's. Bump with Rune's when wgpu is bumped.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "4c4abf5d6d2b47892b3b01c519341b943f5cebcf" }
